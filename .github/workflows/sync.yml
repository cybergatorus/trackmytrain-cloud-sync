name: TrackMyTrain 24/7 Cloud Live Telemetry

on:
  schedule:
    # Runs every 5 minutes in the cloud 24/7/365
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: cloud-sync
  cancel-in-progress: false

jobs:
  telemetry-sync:
    name: 1:1 Live Telemetry Sync
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium & dependencies
        run: npx playwright install --with-deps chromium

      - name: Run 24/7 Live Stream Sync
        run: node sync.js
        env:
            SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TARGET_HOST: ${{ secrets.TARGET_HOST }}
          SYNC_DURATION_SECONDS: '280'
          POLL_INTERVAL_MS: '14000'
